# Same idea as the course "kubectl run load-generator" (busybox + wget loop),
# but with 3 parallel wget loops so one pod can push nginx past 50% CPU.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: s13-hpa
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3; do
            (while true; do wget -q -O- http://hpa-demo-service > /dev/null; done) &
          done
          wait
