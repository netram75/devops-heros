# Copied from 04-hpa/deployment.yaml, only the namespace was added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: s13-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 80
