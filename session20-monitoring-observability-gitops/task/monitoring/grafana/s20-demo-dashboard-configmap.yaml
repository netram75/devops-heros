apiVersion: v1
data:
  s20-demo.json: |-
    {
     "uid": "s20-demo",
     "title": "S20 Demo - podinfo health, CPU and memory",
     "tags": [
      "s20"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "refresh": "10s",
     "time": {
      "from": "now-20m",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "podinfo targets up (health)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(up{namespace=\"s20-monitoring-demo\", service=\"podinfo\"}) or vector(0)",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Ready podinfo pods",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(kube_pod_status_ready{namespace=\"s20-monitoring-demo\", condition=\"true\", pod=~\"podinfo.*\"}) or vector(0)",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 3,
       "type": "stat",
       "title": "Container restarts (15m)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"s20-monitoring-demo\"}[15m])) or vector(0)",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Demo alerts firing",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(ALERTS{alertstate=\"firing\", alertname=~\"Demo.*\"}) or vector(0)",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 5,
       "type": "timeseries",
       "title": "CPU usage per pod (cores)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"s20-monitoring-demo\", container!=\"\"}[1m]))",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "CPU utilisation vs limit",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"s20-monitoring-demo\", container!=\"\"}[1m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"s20-monitoring-demo\", resource=\"cpu\"})",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         },
         "min": 0
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Memory working set per pod",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"s20-monitoring-demo\", container!=\"\"})",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Memory utilisation vs limit",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"s20-monitoring-demo\", container!=\"\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"s20-monitoring-demo\", resource=\"memory\"})",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         },
         "min": 0
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 9,
       "type": "timeseries",
       "title": "podinfo HTTP requests/s by status (app metric)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (status) (rate(http_requests_total{namespace=\"s20-monitoring-demo\"}[1m]))",
         "legendFormat": "{{status}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "podinfo p95 latency",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"s20-monitoring-demo\"}[1m])))",
         "legendFormat": "p95"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      }
     ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: s20-demo-dashboard
  namespace: monitoring
