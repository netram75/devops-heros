# Client in a second namespace, to show that short names only work inside your own namespace.
# alpine + bind-tools so I get the real nslookup/dig (busybox nslookup skips search domains for dotted names).
apiVersion: v1
kind: Pod
metadata:
  name: other-client
  namespace: s11-other
spec:
  containers:
    - name: client
      image: alpine:3.20
      command: ["sh", "-c", "apk add --no-cache bind-tools curl >/dev/null && touch /tmp/ready && sleep 3600"]
      readinessProbe:
        exec:
          command: ["test", "-f", "/tmp/ready"]
        periodSeconds: 2
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
