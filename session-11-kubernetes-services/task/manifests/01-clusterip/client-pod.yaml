apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: s11-services
  labels:
    app: curl-client
spec:
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
