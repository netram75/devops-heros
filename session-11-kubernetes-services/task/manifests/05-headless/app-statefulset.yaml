apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  namespace: s11-services
  labels:
    app: web-headless
spec:
  serviceName: web-service-headless
  replicas: 3
  selector:
    matchLabels:
      app: web-headless
  template:
    metadata:
      labels:
        app: web-headless
    spec:
      containers:
        - name: nginx-stateful
          image: nginx:1.25-alpine
          # added: each pod serves its own name, so I can see which pod answered
          command: ["sh", "-c", "echo \"served by $(hostname)\" > /usr/share/nginx/html/index.html && exec nginx -g \"daemon off;\""]
          ports:
            - name: web
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
