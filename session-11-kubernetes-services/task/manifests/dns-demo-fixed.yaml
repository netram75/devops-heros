# Fixed version: back to the default ClusterFirst policy, so the kubelet writes
# nameserver 10.96.0.10 (kube-dns) and the namespace search list into /etc/resolv.conf.
apiVersion: v1
kind: Pod
metadata:
  name: dns-demo
  namespace: s11-services
spec:
  dnsPolicy: ClusterFirst
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
