# CoreDNS troubleshooting drill: BROKEN on purpose.
# dnsPolicy None means the kubelet does not inject the cluster DNS settings; I hand-wrote
# a nameserver, and 10.96.0.99 is NOT the kube-dns Service IP (that is 10.96.0.10).
apiVersion: v1
kind: Pod
metadata:
  name: dns-demo
  namespace: s11-services
spec:
  dnsPolicy: "None"
  dnsConfig:
    nameservers: ["10.96.0.99"]
    searches: ["s11-services.svc.cluster.local", "svc.cluster.local", "cluster.local"]
    options:
      - name: ndots
        value: "5"
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
