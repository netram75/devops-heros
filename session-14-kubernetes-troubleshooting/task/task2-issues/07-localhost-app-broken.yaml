# App binds to 127.0.0.1 only -> works inside the pod, unreachable from other pods / the Service
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: s14-t2
  name: localhost-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: localhost-app}
  template:
    metadata:
      labels: {app: localhost-app}
    spec:
      containers:
        - name: httpd
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - mkdir -p /www && echo "hello from localhost-app" > /www/index.html &&
              exec httpd -f -v -p 127.0.0.1:8080 -h /www     # BUG: loopback only
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 8Mi}
---
apiVersion: v1
kind: Service
metadata:
  namespace: s14-t2
  name: localhost-app
spec:
  selector: {app: localhost-app}
  ports:
    - port: 80
      targetPort: 8080
