# Pod mounts a ConfigMap volume that does not exist -> stuck in ContainerCreating (FailedMount)
apiVersion: v1
kind: Pod
metadata:
  namespace: s14-t2
  name: mount-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests: {cpu: 10m, memory: 16Mi}
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
  volumes:
    - name: site
      configMap:
        name: site-content          # BUG: this ConfigMap was never created
