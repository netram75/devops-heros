# Final Troubleshooting Challenge: the CORRECT version (end state after all fixes).
apiVersion: v1
kind: Namespace
metadata:
  name: final-troubleshoot
---
apiVersion: v1
kind: Secret
metadata:
  name: ts-app-secret
  namespace: final-troubleshoot
type: Opaque
stringData:
  api-token: "demo-not-a-real-token-456"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-app
  namespace: final-troubleshoot
  labels: { app.kubernetes.io/name: ts-app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ts-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ts-app }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: final-app:1.0.0                      # FIX 1: tag that exists in the node's image cache
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: ts-app-secret, key: api-token }   # FIX 2: key name matches the Secret
          resources:
            requests: { cpu: 50m, memory: 64Mi }        # FIX 5: HPA needs a CPU request to compute %
            limits: { cpu: 250m, memory: 192Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }      # FIX 3: the app serves /readyz, not /ready
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: ts-app
  namespace: final-troubleshoot
spec:
  selector: { app.kubernetes.io/name: ts-app }          # FIX 4: matches the pod label
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-app
  namespace: final-troubleshoot
spec:
  ingressClassName: nginx
  rules:
    - host: ts.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ts-app, port: { name: http } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ts-app
  namespace: final-troubleshoot
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ts-app }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
