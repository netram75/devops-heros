apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-app
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: final-app }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # demo: scale back down after 1 min instead of 5
