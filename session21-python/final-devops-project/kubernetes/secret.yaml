# Demo only. The value is fake and the app does not use it for anything real;
# it exists so the Deployment shows how a Secret is wired in as an env var.
# In a real project this would come from Sealed Secrets / External Secrets, not Git.
apiVersion: v1
kind: Secret
metadata:
  name: final-app-secret
type: Opaque
stringData:
  api-token: "demo-not-a-real-token-123"
