apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  namespace: s12-config
  labels:
    app: yatri-backend
data:
  # simple key/value pairs -> become environment variables
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  APP_PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
  # a whole file -> mounted into the container as /etc/yatri/app.properties
  app.properties: |
    app.name=yatri-backend
    feature.seat_selection=true
    cache.ttl_seconds=300
