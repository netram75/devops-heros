# Two small apps behind one Ingress. Both use nginx:1.25-alpine; their content and
# nginx config come from ConfigMaps so each one answers differently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  namespace: s12-web
data:
  default.conf: |
    server {
      listen 80;
      ssi on;                       # lets the page print the pod name
      root /usr/share/nginx/html;
      location / { index index.html; }
    }
  index.html: |
    <!doctype html>
    <html><head><title>Yatri Frontend</title>
    <style>body{font-family:sans-serif;margin:40px;background:#eef6ff}h1{color:#1a5fb4}code{background:#fff;padding:2px 6px}</style>
    </head><body>
    <h1>Yatri Frontend (served through the nginx Ingress)</h1>
    <p>Service: <code>frontend-svc</code> &middot; Pod: <code><!--# echo var="hostname" --></code></p>
    <p>Host header: <code><!--# echo var="host" --></code> &middot; Path: <code><!--# echo var="request_uri" --></code></p>
    <p>Netram &middot; 24BCS10329 &middot; Session 12</p>
    </body></html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-content
  namespace: s12-web
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type application/json;
        return 200 '{"service":"api-svc","pod":"$hostname","path":"$request_uri","host":"$host"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: s12-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: content, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: content, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: content
          configMap: {name: frontend-content}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s12-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: content, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: content
          configMap: {name: api-content}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: s12-web
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: s12-web
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
