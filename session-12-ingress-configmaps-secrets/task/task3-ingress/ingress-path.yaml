# Path-based routing: one host, the URL path decides the Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-path
  namespace: s12-web
spec:
  ingressClassName: nginx
  rules:
    - host: shop.127.0.0.1.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api-svc, port: {number: 80}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend-svc, port: {number: 80}}
