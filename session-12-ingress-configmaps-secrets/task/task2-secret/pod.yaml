apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12-config
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      # 1) individual keys as env vars
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: {name: yatri-db-secret, key: POSTGRES_USER}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: yatri-db-secret, key: POSTGRES_PASSWORD}
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef: {name: yatri-db-secret, key: POSTGRES_DB}
      # 2) the API key mounted as a file (tmpfs, never written to the node disk)
      volumeMounts:
        - name: api-key
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: api-key
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
        items:
          - key: PAYMENT_API_KEY
            path: payment-api-key
