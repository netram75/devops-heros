# Session 21 - Final DevOps project: CI/CD + DevSecOps + Helm
#
# Build + unit test -> SAST -> SCA -> Secret scan -> Docker build -> Image scan
#   -> Security gate -> Push to GHCR -> Helm deploy to kind + smoke test
#
# Every scanner runs in REPORT mode and uploads its JSON report as an artifact.
# The security-gate job is the single place that decides pass/fail, using
# session21-python/final-devops-project/security/gate-policy.json. Nothing is
# pushed or deployed unless that gate passes.
name: Session 21 - Final project CI/CD

on:
  push:
    branches:
      - main
      - session21-final
    paths:
      - "session21-python/final-devops-project/application/**"
      - "session21-python/final-devops-project/docker/**"
      - "session21-python/final-devops-project/security/**"
      - "session21-python/final-devops-project/helm/**"
      - ".github/workflows/session21-final.yml"
  workflow_dispatch:

# Actions: GitHub-owned ones (actions/*, github/*) use the same major tags as my
# Session 16/17 workflows; third-party ones (docker/*, helm/*) are pinned to the
# same full commit SHAs Session 17 used, so a moved tag cannot change what runs.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so cancel it.
concurrency:
  group: session21-final-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: session21-python/final-devops-project
  IMAGE_NAME: ghcr.io/netram75/devops-heros-final
  PYTHON_VERSION: "3.13"
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0
  GITLEAKS_VERSION: 8.30.1
  BANDIT_VERSION: 1.9.4
  PIP_AUDIT_VERSION: 2.10.1
  RELEASE: final-app
  NAMESPACE: final-app

defaults:
  run:
    working-directory: session21-python/final-devops-project

jobs:
  # ------------------------------------------------------------ 1. build + unit test
  build-test:
    name: 1. Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/application/requirements*.txt

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: pip install -r requirements-dev.txt

      - name: Build (byte-compile every module, fails on syntax errors)
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: python -m compileall -q app

      - name: Unit tests with coverage
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: |
          mkdir -p ../reports
          python -m pytest --cov=app --cov-report=term-missing \
            --cov-report=xml:../reports/coverage.xml --cov-fail-under=90 \
            --junitxml=../reports/junit.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ env.PROJECT_DIR }}/reports/

  # ------------------------------------------------------------ 2. SAST
  sast:
    name: 2. SAST (Bandit + Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit (Python SAST)
        run: |
          pip install "bandit==${BANDIT_VERSION}"
          mkdir -p reports
          bandit -c security/bandit.yaml -r application/app -f json -o reports/bandit.json --exit-zero
          bandit -c security/bandit.yaml -r application/app -f screen --exit-zero

      - name: Semgrep (p/python + p/flask + project rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
              --config p/python --config p/flask --config security/semgrep-rules.yml \
              --json-output=reports/semgrep.json --text application/app

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-sast
          path: ${{ env.PROJECT_DIR }}/reports/

  # ------------------------------------------------------------ 3. SCA
  sca:
    name: 3. SCA (pip-audit + Trivy fs)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (PyPI advisory database / OSV)
        run: |
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
          mkdir -p reports
          # pip-audit exits 1 when it finds something. Keep the report and let the
          # gate decide; if pip-audit crashes the report is missing and the gate fails closed.
          pip-audit -r application/requirements.txt -f json -o reports/pip-audit.json || echo "pip-audit reported findings (exit $?)"
          pip-audit -r application/requirements.txt || true

      - name: Trivy fs (dependencies + Dockerfile + Helm chart misconfig + secrets)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet \
            --config security/trivy.yaml --scanners vuln,misconfig,secret \
            --format json -o reports/trivy-fs.json .
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" convert \
            --format table reports/trivy-fs.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-sca
          path: ${{ env.PROJECT_DIR }}/reports/

  # ------------------------------------------------------------ 4. secret scan
  secret-scan:
    name: 4. Secret scan (Gitleaks, history of the build commit)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit, so a secret that was "deleted" later is still found

      - name: Install Gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks over the history of HEAD
        working-directory: .
        run: |
          mkdir -p "$PROJECT_DIR/reports"
          # Gitleaks' default is `git log --all`, which would also scan every OTHER
          # branch the checkout fetched. Scan only the history of the commit being built.
          gitleaks git . --config "$PROJECT_DIR/security/gitleaks.toml" \
            --log-opts="--full-history HEAD" \
            --redact --no-banner --verbose --exit-code 0 \
            --report-format json --report-path "$PROJECT_DIR/reports/gitleaks.json"
          echo "findings: $(python3 -c "import json;print(len(json.load(open('$PROJECT_DIR/reports/gitleaks.json'))))")"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-secrets
          path: ${{ env.PROJECT_DIR }}/reports/

  # ------------------------------------------------------------ 5. docker build
  docker-build:
    name: 5. Docker build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (saved as a tarball, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/docker/Dockerfile
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=session21
          cache-to: type=gha,scope=session21,mode=max

      - name: Smoke test the container (read-only rootfs, non-root, HEALTHCHECK)
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          docker image inspect "$IMAGE_NAME:${{ github.sha }}" \
            --format 'user={{.Config.User}} healthcheck={{json .Config.Healthcheck.Test}}'
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 "$IMAGE_NAME:${{ github.sha }}"
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$state" = healthy ] && break
            sleep 2
          done
          echo "container health: $state"
          curl -sf localhost:8080/ && echo
          docker exec smoke id
          docker rm -f smoke
          [ "$state" = healthy ]

      - uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar
          retention-days: 3

  # ------------------------------------------------------------ 6. image scan
  image-scan:
    name: 6. Container image scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - name: Trivy image (OS + Python packages + secrets in layers)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP:/img" -w /src "$TRIVY_IMAGE" image --quiet \
            --config security/trivy.yaml --scanners vuln,secret \
            --format json -o reports/trivy-image.json --input /img/image.tar
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" convert \
            --format table --severity HIGH,CRITICAL reports/trivy-image.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-image
          path: ${{ env.PROJECT_DIR }}/reports/

  # ------------------------------------------------------------ 7. security gate
  security-gate:
    name: 7. Security gate
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download every scan report
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ env.PROJECT_DIR }}/gate-input

      - name: Evaluate reports against gate-policy.json
        run: |
          ls -l gate-input
          python3 security/security_gate.py --reports gate-input \
            --policy security/gate-policy.json --out gate-input/gate-result.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-result
          path: ${{ env.PROJECT_DIR }}/gate-input/gate-result.json

  # ------------------------------------------------------------ 8. push
  push-image:
    name: 8. Push image to GHCR
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that was scanned (:sha and :latest)
        id: push
        working-directory: .
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA" | tee push.log
          docker push "$IMAGE_NAME:latest"
          digest=$(grep -o 'digest: sha256:[0-9a-f]*' push.log | head -1 | cut -d' ' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE_NAME:$GITHUB_SHA and :latest ($IMAGE_NAME@$digest)"
          echo "### Pushed \`$IMAGE_NAME:$GITHUB_SHA\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ 9. deploy
  deploy:
    name: 9. Helm deploy to kind + smoke test
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: session21

      - name: Lint and render the chart
        run: |
          helm version --short
          helm lint helm/final-app
          helm lint helm/final-app -f helm/final-app/values-prod.yaml
          helm template "$RELEASE" helm/final-app --set image.tag="$GITHUB_SHA" > rendered.yaml
          grep -E '^kind:|image:' rendered.yaml

      - name: Namespace + GHCR pull secret
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: helm upgrade --install with the pushed image
        run: |
          helm upgrade --install "$RELEASE" helm/final-app \
            --namespace "$NAMESPACE" \
            --set image.repository="$IMAGE_NAME" \
            --set image.tag="$GITHUB_SHA" \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --wait --timeout 180s
          helm -n "$NAMESPACE" list
          helm -n "$NAMESPACE" history "$RELEASE"

      - name: Verify pods, probes and security context
        run: |
          kubectl -n "$NAMESPACE" get deploy,rs,pods,svc,hpa,cm,secret -o wide
          kubectl -n "$NAMESPACE" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"  image="}{.spec.containers[0].image}{"  ready="}{.status.containerStatuses[0].ready}{"\n"}{end}'
          pod=$(kubectl -n "$NAMESPACE" get pods -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NAMESPACE" exec "$pod" -- id
          kubectl -n "$NAMESPACE" exec "$pod" -- sh -c 'touch /should-fail 2>&1 || echo "root filesystem is read-only (expected)"'

      - name: Smoke test through the Service (port-forward)
        run: |
          kubectl -n "$NAMESPACE" port-forward "svc/$RELEASE" 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          set -x
          curl -sf localhost:8080/healthz
          curl -sf localhost:8080/readyz
          body=$(curl -sf localhost:8080/)
          echo "$body"
          # The deployed pod must report the commit we built and the config/secret from the chart.
          echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""
          echo "$body" | grep -q '"environment":"dev"'
          echo "$body" | grep -q '"secret_configured":true'
          curl -sf -X POST -H 'content-type: application/json' -d '{"title":"deployed by helm"}' localhost:8080/api/items
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/items/999)" = 404

      - name: Collect deployment evidence
        if: always()
        run: |
          mkdir -p deploy-evidence
          cp rendered.yaml deploy-evidence/ 2>/dev/null || true
          helm -n "$NAMESPACE" status "$RELEASE" > deploy-evidence/helm-status.txt 2>&1 || true
          kubectl -n "$NAMESPACE" get all,cm,secret,hpa -o wide > deploy-evidence/get-all.txt 2>&1 || true
          kubectl -n "$NAMESPACE" describe deployment "$RELEASE" > deploy-evidence/describe-deploy.txt 2>&1 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp > deploy-evidence/events.txt 2>&1 || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --tail=50 > deploy-evidence/logs.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-evidence
          path: ${{ env.PROJECT_DIR }}/deploy-evidence/
