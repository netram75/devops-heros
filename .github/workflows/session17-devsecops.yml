# Session 17 - Complete CI/CD and DevSecOps pipeline
#
# Code -> Build -> Unit Test -> SAST -> SCA -> Secret Scan -> Docker Build
#      -> Container Image Scan -> Security Gate -> Push Image -> Deploy to Kubernetes
#
# Every scanner runs in REPORT mode and uploads its JSON report as an artifact.
# The security-gate job downloads all reports and is the one place that decides
# pass/fail (session-17-devsecops/task/security/gate-policy.json). Nothing is
# pushed to GHCR or deployed unless that gate passes.
name: Session 17 - DevSecOps pipeline

on:
  push:
    branches:
      - main
      - session17-devsecops
    paths:
      - "session-17-devsecops/task/**"
      - ".github/workflows/session17-devsecops.yml"
  workflow_dispatch:

# Actions: GitHub-owned ones (actions/*, github/*) use their major tag; third-party
# ones (docker/*, helm/*) are pinned to a full commit SHA so a moved tag cannot
# change what runs in this pipeline.
#
# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: session17-devsecops-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: session-17-devsecops/task
  IMAGE_NAME: ghcr.io/netram75/devops-heros-session17
  PYTHON_VERSION: "3.13"
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0
  GITLEAKS_VERSION: 8.30.1
  BANDIT_VERSION: 1.9.4
  PIP_AUDIT_VERSION: 2.10.1

defaults:
  run:
    working-directory: session-17-devsecops/task

jobs:
  # ---------------------------------------------------------------- 1. build + unit test
  build-test:
    name: 1. Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build (byte-compile every module, fails on syntax errors)
        run: python -m compileall -q app

      - name: Unit tests with coverage
        run: |
          mkdir -p reports
          python -m pytest --cov=app --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml --cov-fail-under=90 \
            --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/reports/

  # ---------------------------------------------------------------- 2. SAST
  sast:
    name: 2. SAST (Bandit + Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit (Python SAST)
        run: |
          pip install "bandit[sarif]==${BANDIT_VERSION}"
          mkdir -p reports
          bandit -c security/bandit.yaml -r app -f json -o reports/bandit.json --exit-zero
          bandit -c security/bandit.yaml -r app -f sarif -o reports/bandit.sarif --exit-zero
          bandit -c security/bandit.yaml -r app -f screen --exit-zero

      - name: Semgrep (p/python + p/flask + project rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
              --config p/python --config p/flask --config security/semgrep-rules.yml \
              --json-output=reports/semgrep.json --sarif-output=reports/semgrep.sarif \
              --text app

      - name: Upload Bandit SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.APP_DIR }}/reports/bandit.sarif
          category: bandit

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.APP_DIR }}/reports/semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-sast
          path: ${{ env.APP_DIR }}/reports/

  # ---------------------------------------------------------------- 3. SCA
  sca:
    name: 3. SCA (pip-audit + Trivy fs)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (PyPI advisory database / OSV)
        run: |
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
          mkdir -p reports
          # pip-audit exits 1 when it finds something. Keep the report and let the
          # gate decide; if pip-audit crashes the report is missing and the gate fails closed.
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json || echo "pip-audit reported findings (exit $?)"
          pip-audit -r requirements.txt || true

      - name: Trivy fs (dependencies + Dockerfile/K8s misconfig + secrets)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet \
            --config security/trivy.yaml --scanners vuln,misconfig,secret \
            --format json -o reports/trivy-fs.json .
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" convert \
            --format table reports/trivy-fs.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-sca
          path: ${{ env.APP_DIR }}/reports/

  # ---------------------------------------------------------------- 4. secret scan
  secret-scan:
    name: 4. Secret scan (Gitleaks, full history of HEAD)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit, so a secret that was "deleted" later is still found

      - name: Install Gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks over the whole repository history
        working-directory: .
        run: |
          mkdir -p "$APP_DIR/reports"
          # Gitleaks' default is `git log --all`, which also scans every OTHER branch the
          # checkout fetched. Scan only the history of the commit being built.
          gitleaks git . --config "$APP_DIR/security/gitleaks.toml" \
            --log-opts="--full-history HEAD" \
            --redact --no-banner --verbose --exit-code 0 \
            --report-format json --report-path "$APP_DIR/reports/gitleaks.json"
          echo "findings: $(python3 -c "import json;print(len(json.load(open('$APP_DIR/reports/gitleaks.json'))))")"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-secrets
          path: ${{ env.APP_DIR }}/reports/

  # ---------------------------------------------------------------- 5. docker build
  docker-build:
    name: 5. Docker build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (saved as a tarball, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=session17
          cache-to: type=gha,scope=session17,mode=max

      - name: Smoke test the container (read-only rootfs, non-root, HEALTHCHECK)
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          docker image inspect "$IMAGE_NAME:${{ github.sha }}" \
            --format 'user={{.Config.User}} healthcheck={{json .Config.Healthcheck.Test}}'
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 "$IMAGE_NAME:${{ github.sha }}"
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$state" = healthy ] && break
            sleep 2
          done
          echo "container health: $state"
          curl -sf localhost:8080/ && echo
          docker exec smoke id
          docker rm -f smoke
          [ "$state" = healthy ]

      - uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar
          retention-days: 3

  # ---------------------------------------------------------------- 6. image scan
  image-scan:
    name: 6. Container image scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - name: Trivy image (OS + Python packages + secrets in layers)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP:/img" -w /src "$TRIVY_IMAGE" image --quiet \
            --config security/trivy.yaml --scanners vuln,secret \
            --format json -o reports/trivy-image.json --input /img/image.tar
          # Human-readable view of what the gate will care about.
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" convert \
            --format table --severity HIGH,CRITICAL reports/trivy-image.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-image
          path: ${{ env.APP_DIR }}/reports/

  # ---------------------------------------------------------------- 7. security gate
  security-gate:
    name: 7. Security gate
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download every scan report
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ env.APP_DIR }}/gate-input

      - name: Evaluate reports against gate-policy.json
        run: |
          ls -l gate-input
          python3 security/security_gate.py --reports gate-input \
            --policy security/gate-policy.json --out gate-input/gate-result.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-result
          path: ${{ env.APP_DIR }}/gate-input/gate-result.json

  # ---------------------------------------------------------------- 8. push
  push-image:
    name: 8. Push image to GHCR
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that was scanned
        id: push
        working-directory: .
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:$branch_tag"
          docker push "$IMAGE_NAME:$GITHUB_SHA" | tee push.log
          docker push "$IMAGE_NAME:$branch_tag"
          # Take the digest from the registry's answer, so the deploy job can pin it.
          digest=$(grep -o 'digest: sha256:[0-9a-f]*' push.log | head -1 | cut -d' ' -f2)
          [ -n "$digest" ] || digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE_NAME:$GITHUB_SHA ($IMAGE_NAME@$digest)"
          echo "### Pushed \`$IMAGE_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 9. deploy
  deploy:
    name: 9. Deploy to Kubernetes (kind) + smoke test
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: session17

      - name: Pull secret for GHCR
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n session17 create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy the gated image by digest
        env:
          DIGEST: ${{ needs.push-image.outputs.digest }}
        run: |
          sed -i "s|image: ghcr.io/netram75/devops-heros-session17:.*|image: $IMAGE_NAME@$DIGEST|" k8s/deployment.yaml
          grep -n 'image:' k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl -n session17 rollout status deployment/release-checklist --timeout=180s

      - name: Verify pods, probes and security context
        run: |
          kubectl -n session17 get deploy,rs,pods,svc -o wide
          kubectl -n session17 get pods -o jsonpath='{range .items[*]}{.metadata.name}{"  image="}{.status.containerStatuses[0].imageID}{"  ready="}{.status.containerStatuses[0].ready}{"\n"}{end}'
          pod=$(kubectl -n session17 get pods -o jsonpath='{.items[0].metadata.name}')
          kubectl -n session17 exec "$pod" -- id
          kubectl -n session17 exec "$pod" -- sh -c 'touch /should-fail 2>&1 || echo "root filesystem is read-only (expected)"'

      - name: Smoke test through the Service
        run: |
          kubectl -n session17 port-forward svc/release-checklist 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          set -x
          curl -sf localhost:8080/healthz
          curl -sf localhost:8080/
          curl -sf -X POST -H 'content-type: application/json' -d '{"title":"deployed by the pipeline"}' localhost:8080/api/items
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/items/999)" = 404

      - name: Collect deployment evidence
        if: always()
        run: |
          mkdir -p deploy-evidence
          kubectl -n session17 get all -o wide > deploy-evidence/get-all.txt 2>&1 || true
          kubectl -n session17 describe deployment release-checklist > deploy-evidence/describe-deploy.txt 2>&1 || true
          kubectl -n session17 get events --sort-by=.lastTimestamp > deploy-evidence/events.txt 2>&1 || true
          kubectl -n session17 logs -l app.kubernetes.io/name=release-checklist --tail=50 > deploy-evidence/logs.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-evidence
          path: ${{ env.APP_DIR }}/deploy-evidence/
